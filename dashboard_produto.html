<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Produtos — Taalex</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;min-height:100vh;padding:16px;}
.db{background:#1A1A1A;border-radius:12px;overflow:hidden;max-width:1400px;margin:0 auto;}
.hdr{background:#111;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap;gap:10px;}
.hdr-left{display:flex;align-items:center;gap:14px;}
.logo-img{height:38px;width:auto;}
.hdr-div{width:1px;height:30px;background:rgba(255,255,255,.1);}
.nav{display:flex;gap:6px;}
.nav a{font-size:11px;padding:5px 12px;border-radius:6px;text-decoration:none;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.08);}
.nav a.active{background:rgba(39,174,96,.15);color:#82E0AA;border-color:rgba(39,174,96,.4);}
.nav button{font-size:11px;padding:5px 12px;border-radius:6px;background:none;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.08);cursor:pointer;font-family:inherit;}
.nav button:hover{color:#fff;border-color:rgba(255,255,255,.3);}
.hdr-title{font-size:15px;font-weight:600;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.hdr-right{text-align:right;}
.hdr-date{font-size:12px;color:rgba(255,255,255,.4);}
.hdr-update{font-size:10px;color:rgba(255,255,255,.2);margin-top:2px;}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;}

.legend{font-size:11px;color:rgba(255,255,255,.4);display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.banner{background:#1E1810;border:1px solid rgba(230,126,34,.4);color:#F0B27A;border-radius:10px;padding:10px 14px;font-size:12px;}

.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.kpi{background:#242424;border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.06);}
.kpi.warn{border-color:rgba(230,126,34,.4);background:#1E1810;}
.kpi.bad{border-color:rgba(231,76,60,.4);background:#1E1212;}
.kpi.ok{border-color:rgba(39,174,96,.3);background:#101E12;}
.kpi-label{font-size:10px;color:rgba(255,255,255,.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}
.kpi-val{font-size:20px;font-weight:700;color:#fff;line-height:1.1;}
.kpi-val.green{color:#82E0AA;}
.kpi-val.amber{color:#E67E22;}
.kpi-val.red{color:#F1948A;}
.kpi-delta{font-size:10px;margin-top:6px;color:rgba(255,255,255,.3);}

.etapas{display:flex;gap:10px;flex-wrap:wrap;}
.etapa{background:#1E1E1E;border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 14px;min-width:110px;}
.etapa-n{font-size:18px;font-weight:700;color:#fff;}
.etapa-l{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

.card{background:#242424;border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.06);}
.card.alert{border-color:rgba(230,126,34,.4);}
.card.crit{border-color:rgba(231,76,60,.45);}
.card-title{font-size:10px;font-weight:600;color:rgba(255,255,255,.35);margin-bottom:4px;text-transform:uppercase;letter-spacing:.07em;}
.card-sub{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:12px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.sec-count{font-size:11px;color:rgba(255,255,255,.3);}
.sec-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin:4px 2px 0;}
.alert-title{color:#F0B27A;}

.badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.b-red{background:rgba(231,76,60,.25);color:#F1948A;}
.b-amber{background:rgba(230,126,34,.2);color:#F0B27A;}
.b-green{background:rgba(39,174,96,.2);color:#82E0AA;}
.b-blue{background:rgba(52,152,219,.2);color:#85C1E9;}
.b-gray{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);}
.b-purple{background:rgba(155,89,182,.2);color:#C39BD3;}

.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;vertical-align:bottom;}
thead th.r,tbody td.r{text-align:right;}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.75);vertical-align:top;}
td.num{max-width:130px;overflow-wrap:anywhere;word-break:break-word;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(255,255,255,.03);}
td.wrap{white-space:normal;min-width:160px;}
td.strong{font-weight:600;color:#fff;}
.muted{color:rgba(255,255,255,.3);}
.empty{padding:22px;text-align:center;color:rgba(255,255,255,.25);font-size:12px;}
.total-row td{border-top:1px solid rgba(255,255,255,.1);font-weight:700;color:#fff;padding-top:12px;}
.faltas{display:flex;gap:5px;flex-wrap:wrap;}

.pauta-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:flex-start;}
.pauta-item:last-child{border-bottom:none;}
.pauta-n{flex-shrink:0;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.pn-alta{background:rgba(231,76,60,.25);color:#F1948A;}
.pn-media{background:rgba(230,126,34,.2);color:#F0B27A;}
.pn-normal{background:rgba(52,152,219,.2);color:#85C1E9;}
.pauta-t{font-size:13px;font-weight:600;color:#fff;}
.pauta-d{font-size:11px;color:rgba(255,255,255,.4);margin:2px 0 6px;}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:10px;background:#1E1E1E;border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:2px 7px;color:rgba(255,255,255,.65);}

.footer{padding:10px 20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;}
.footer-text{font-size:10px;color:rgba(255,255,255,.15);}

@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
@media print{body{background:#fff;color:#000;padding:0;}}

.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.search{flex:1;min-width:260px;background:#1E1E1E;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;color:#fff;font-size:14px;font-family:inherit;outline:none;}
.search:focus{border-color:rgba(39,174,96,.6);}
.search::placeholder{color:rgba(255,255,255,.3);}
.chips-f{display:flex;gap:6px;}
.fbtn{font-size:11px;padding:6px 12px;border-radius:6px;background:none;color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.1);cursor:pointer;font-family:inherit;}
.fbtn.on{background:rgba(39,174,96,.15);color:#82E0AA;border-color:rgba(39,174,96,.4);}
.hit{background:rgba(241,196,15,.28);color:#fff;border-radius:2px;padding:0 1px;}
td.prod{min-width:200px;max-width:340px;color:#fff;font-weight:600;}
thead th.sortable{cursor:pointer;}
thead th.sortable:hover{color:#fff;}
</style>
</head>

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function semAcento(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function dash(v){ return v? esc(v) : '<span class="muted">—</span>'; }

// destaca os termos buscados (sem diferenciar acento/maiúscula)
function hl(texto, termos){
  var t=String(texto==null?'':texto);
  if(!t) return '<span class="muted">—</span>';
  if(!termos.length) return esc(t);
  var base=semAcento(t), marca=new Array(t.length).fill(false);
  termos.forEach(function(q){
    var i=base.indexOf(q);
    while(i>=0){ for(var k=i;k<i+q.length;k++) marca[k]=true; i=base.indexOf(q,i+q.length); }
  });
  var out='', abre=false;
  for(var j=0;j<t.length;j++){
    if(marca[j]&&!abre){ out+='<span class="hit">'; abre=true; }
    if(!marca[j]&&abre){ out+='</span>'; abre=false; }
    out+=esc(t[j]);
  }
  return out+(abre?'</span>':'');
}

function badgeStatus(s){
  var up=(s||'').toUpperCase().trim();
  if(!up) return '<span class="badge b-gray">Sem status</span>';
  if(up==='SOBRE AGUAS'||up==='SOBRE ÁGUAS') return '<span class="badge b-blue">Sobre águas</span>';
  if(up==='VISTORIA') return '<span class="badge b-amber">Vistoria</span>';
  if(up==='DESEMBRAÇO'||up==='DESEMBARAÇO') return '<span class="badge b-purple">Desembaraço</span>';
  if(up==='EM PRODUÇÃO') return '<span class="badge b-gray">Em produção</span>';
  if(up==='ATRACADO') return '<span class="badge b-green">Atracado</span>';
  if(up==='FINALIZADO') return '<span class="badge b-gray">Finalizado</span>';
  return '<span class="badge b-gray">'+esc(s)+'</span>';
}
function cntr(e){
  var p=[];
  if(e.qtdCntr>0) p.push(e.qtdCntr+' cntr');
  if(e.tipoCntr) p.push(esc(e.tipoCntr));
  return p.length? p.join(' · ') : '<span class="muted">—</span>';
}
function dt(v){ return v? '<span style="font-weight:600;color:#fff;">'+esc(v)+'</span>' : '<span class="muted">—</span>'; }
function chave(v){ return v? v.split('/').reverse().join('') : ''; }   // dd/mm/aaaa -> aaaammdd

var filtro='ativos', ordem={k:'eta', asc:true};
var CAMPOS_BUSCA=['produto','projeto','codProjeto','embarque','pedido','fornecedor','invoice'];

function termosDaBusca(){
  return semAcento(document.getElementById('q').value).split(/\s+/).filter(Boolean);
}

function filtrar(termos){
  return DADOS.itens.filter(function(e){
    if(filtro==='ativos' && !e.ativo) return false;
    if(filtro==='finalizados' && e.ativo) return false;
    if(!termos.length) return true;
    var alvo=semAcento(CAMPOS_BUSCA.map(function(c){return e[c]||'';}).join(' | '));
    return termos.every(function(t){ return alvo.indexOf(t)>=0; });
  });
}

function ordenar(lista){
  var k=ordem.k;
  var val=function(e){
    if(k==='eta'||k==='etd'||k==='entrega') return chave(e[k]);
    if(k==='qtdCntr') return e.qtdCntr;
    return semAcento(e[k]||'');
  };
  return lista.slice().sort(function(a,b){
    var x=val(a), y=val(b);
    var vx=(x===''||x===0&&k!=='qtdCntr'), vy=(y===''||y===0&&k!=='qtdCntr');
    if(vx!==vy) return vx?1:-1;                 // vazios sempre no fim
    if(x<y) return ordem.asc?-1:1;
    if(x>y) return ordem.asc?1:-1;
    return semAcento(a.embarque).localeCompare(semAcento(b.embarque));
  });
}

var COLS=[
  {k:'produto',h:'Produto'},{k:'projeto',h:'Projeto'},{k:'codProjeto',h:'Cód. projeto'},
  {k:'embarque',h:'Embarque'},{k:'pedido',h:'Pedido'},{k:'fornecedor',h:'Fornecedor'},
  {k:'invoice',h:'Invoice'},{k:'qtdCntr',h:'Containers'},{k:'etd',h:'ETD'},{k:'eta',h:'ETA'},
  {k:'entrega',h:'Prev. entrega cliente'},{k:'status',h:'Status'}
];

function render(){
  var termos=termosDaBusca();
  var lista=ordenar(filtrar(termos));
  document.getElementById('count').textContent =
    lista.length+(lista.length===1?' item':' itens')+' de '+DADOS.itens.length;
  if(!lista.length){
    document.getElementById('res').innerHTML='<div class="empty">Nenhum item encontrado'+(termos.length?' para essa busca':'')+'</div>';
    return;
  }
  var th=COLS.map(function(c){
    var seta=ordem.k===c.k?(ordem.asc?' ▲':' ▼'):'';
    return '<th class="sortable" data-k="'+c.k+'">'+c.h+seta+'</th>';
  }).join('');
  var tr=lista.map(function(e){
    return '<tr>'+
      '<td class="prod">'+hl(e.produto,termos)+'</td>'+
      '<td style="min-width:120px;">'+hl(e.projeto,termos)+'</td>'+
      '<td class="num">'+hl(e.codProjeto,termos)+'</td>'+
      '<td class="strong">'+hl(e.embarque,termos)+'</td>'+
      '<td class="num">'+hl(e.pedido,termos)+'</td>'+
      '<td style="min-width:110px;">'+hl(e.fornecedor,termos)+'</td>'+
      '<td class="num">'+hl(e.invoice,termos)+'</td>'+
      '<td>'+cntr(e)+'</td>'+
      '<td>'+dt(e.etd)+'</td>'+
      '<td>'+dt(e.eta)+'</td>'+
      '<td>'+dt(e.entrega)+'</td>'+
      '<td>'+badgeStatus(e.status)+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('res').innerHTML='<table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table>';
  Array.prototype.forEach.call(document.querySelectorAll('th.sortable'),function(el){
    el.onclick=function(){
      var k=el.getAttribute('data-k');
      if(ordem.k===k) ordem.asc=!ordem.asc; else ordem={k:k,asc:true};
      render();
    };
  });
}

function renderFiltros(){
  var ops=[['ativos','Em andamento ('+DADOS.ativos+')'],['todos','Todos ('+DADOS.total+')'],
           ['finalizados','Finalizados ('+(DADOS.total-DADOS.ativos)+')']];
  var el=document.getElementById('filtros');
  el.innerHTML=ops.map(function(o){
    return '<button class="fbtn'+(filtro===o[0]?' on':'')+'" data-f="'+o[0]+'">'+o[1]+'</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'),function(b){
    b.onclick=function(){ filtro=b.getAttribute('data-f'); renderFiltros(); render(); };
  });
}

function init(){
  var now=new Date();
  document.getElementById('hdr-date').textContent=now.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  document.getElementById('hdr-update').textContent='Dados de '+DADOS.geradoEm;
  document.getElementById('footer-update').textContent='Gerado em '+DADOS.geradoEm;
  document.getElementById('q').addEventListener('input',render);
  renderFiltros();
  render();
}
init();
</script>
