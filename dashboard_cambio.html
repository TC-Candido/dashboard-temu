<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;min-height:100vh;padding:16px;}
.db{background:#1A1A1A;border-radius:12px;overflow:hidden;max-width:1400px;margin:0 auto;}
.hdr{background:#111;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);}
.hdr-left{display:flex;align-items:center;gap:14px;}
.logo-img{height:38px;width:auto;}
.hdr-div{width:1px;height:30px;background:rgba(255,255,255,.1);}
.nav{display:flex;gap:6px;}
.nav a{font-size:11px;padding:5px 12px;border-radius:6px;text-decoration:none;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.08);transition:all .15s;}
.nav a:hover{color:#fff;border-color:rgba(255,255,255,.2);}
.nav a.active{background:rgba(192,57,43,.2);color:#F1948A;border-color:rgba(192,57,43,.4);}
.hdr-title{font-size:15px;font-weight:600;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.hdr-right{text-align:right;}
.hdr-date{font-size:12px;color:rgba(255,255,255,.4);}
.hdr-update{font-size:10px;color:rgba(255,255,255,.2);margin-top:2px;}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.kpi{background:#242424;border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.06);}
.kpi.alert{border-color:rgba(192,57,43,.5);background:#1E1010;}
.kpi.warn{border-color:rgba(230,126,34,.4);background:#1E1810;}
.kpi-label{font-size:10px;color:rgba(255,255,255,.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;}
.kpi-val{font-size:22px;font-weight:600;color:#fff;line-height:1;}
.kpi-val.red{color:#E74C3C;}.kpi-val.amber{color:#E67E22;}
.kpi-delta{font-size:11px;margin-top:6px;}
.green{color:#27AE60;}.amber-t{color:#E67E22;}.red-t{color:#E74C3C;}.gray{color:rgba(255,255,255,.3);}
.mid-row{display:grid;grid-template-columns:1.2fr 1fr 0.8fr;gap:10px;}
.card{background:#242424;border-radius:10px;padding:14px 16px;border:1px solid rgba(255,255,255,.06);}
.card-title{font-size:10px;font-weight:600;color:rgba(255,255,255,.35);margin-bottom:12px;text-transform:uppercase;letter-spacing:.07em;}
.tl-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:3px;}
.tl-line{width:1px;height:18px;background:rgba(255,255,255,.07);margin-top:3px;}
.tl-content{flex:1;}
.tl-name{font-size:12px;color:rgba(255,255,255,.85);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.tl-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px;}
.badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.b-red{background:rgba(231,76,60,.25);color:#F1948A;}
.b-amber{background:rgba(230,126,34,.2);color:#F0B27A;}
.b-green{background:rgba(39,174,96,.2);color:#82E0AA;}
.b-blue{background:rgba(52,152,219,.2);color:#85C1E9;}
.b-gray{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35);}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.legend-name{font-size:11px;color:rgba(255,255,255,.55);flex:1;}
.legend-val{font-size:11px;color:rgba(255,255,255,.4);text-align:right;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-name{font-size:10px;color:rgba(255,255,255,.45);width:70px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-val{font-size:10px;color:rgba(255,255,255,.35);width:80px;text-align:right;}
.search-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
.search-bar{display:flex;align-items:center;gap:8px;background:#1E1E1E;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;transition:border-color .2s;flex:0 0 260px;}
.search-bar:focus-within{border-color:rgba(192,57,43,.6);}
.search-bar svg{width:14px;height:14px;opacity:.4;flex-shrink:0;}
.search-bar input{background:transparent;border:none;outline:none;color:#fff;font-size:12px;flex:1;font-family:inherit;}
.search-bar input::placeholder{color:rgba(255,255,255,.2);}
.search-clear{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:16px;padding:0;line-height:1;display:none;}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{background:#1E1E1E;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 10px;font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;font-family:inherit;}
.filter-btn:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.8);}
.filter-btn.active{background:rgba(192,57,43,.2);border-color:rgba(192,57,43,.5);color:#F1948A;}
.search-count{font-size:11px;color:rgba(255,255,255,.25);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:9px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;}
thead th:hover{color:rgba(255,255,255,.6);}
tbody td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.75);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(255,255,255,.03);}
.highlight{background:rgba(192,57,43,.35);border-radius:2px;padding:0 2px;color:#fff;}
.no-results{text-align:center;padding:30px;color:rgba(255,255,255,.2);font-size:13px;}
.footer{padding:10px 20px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;}
.footer-text{font-size:10px;color:rgba(255,255,255,.15);}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}.mid-row{grid-template-columns:1fr;}}
</style>
</head>

      <div class="card">
        <div class="card-title">Próximos vencimentos</div>
        <div id="timeline"></div>
      </div>
      <div class="card">
        <div class="card-title">Saldo por fornecedor (USD)</div>
        <div id="forn-bars"></div>
      </div>
      <div class="card">
        <div class="card-title">Por status câmbio</div>
        <div style="display:flex;justify-content:center;margin-bottom:12px;">
          <canvas id="pieChart" width="120" height="120"></canvas>
        </div>
        <div id="pie-legend"></div>
      </div>
    </div>
    <div class="card">
      <div class="search-wrap">
        <div class="card-title" style="margin-bottom:0;">Câmbios em andamento</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="filter-btns" id="filter-btns"></div>
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar projeto, fornecedor..." oninput="filterTable(this.value)" autocomplete="off"/>
            <button class="search-clear" id="clearBtn" onclick="clearSearch()">×</button>
          </div>
          <span class="search-count" id="searchCount"></span>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th onclick="sortTable('projeto')">Projeto ↕</th>
            <th onclick="sortTable('embarque')">Embarque ↕</th>
            <th onclick="sortTable('fornecedor')">Fornecedor ↕</th>
            <th>Fatura</th>
            <th style="text-align:right" onclick="sortTable('valor')">Valor USD ↕</th>
            <th style="text-align:center">% P1</th>
            <th style="text-align:right">Pago P1</th>
            <th style="text-align:center">% P2</th>
            <th style="text-align:right">Pago P2</th>
            <th style="text-align:center">% P3</th>
            <th style="text-align:right">Pago P3</th>
            <th style="text-align:right" onclick="sortTable('saldo')">Saldo ↕</th>
            <th onclick="sortTable('statusCambio')">Status Câmbio ↕</th>
            <th onclick="sortTable('previsaoDias')">Previsão ↕</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="noResults" class="no-results" style="display:none;">Nenhum câmbio encontrado</div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-text">Taalex Systemtechnik GmbH — Controle de Câmbio 2026</div>
    <div class="footer-text" id="footer-update"></div>
  </div>
</div>
<script>
const PIE_COLORS=['#E74C3C','#E67E22','#3498DB','#27AE60','#9B59B6','#555','#F39C12'];
let allData=null,filteredData=[],currentSearch='',currentFilter='todos',sortKey='',sortAsc=true,pieChart=null;
function fmtUSD(v){return '$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(v){return v?v+'%':'—';}
function hl(text,q){if(!q||!text)return text||'—';const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return String(text).replace(re,'<span class="highlight">$1</span>');}
function badgeVenc(sv,label){
  if(sv==='Quitado')return '<span class="badge b-green">✅ Quitado</span>';
  if(sv==='Vencido')return '<span class="badge b-red">🔴 Vencido</span>';
  if(sv==='Vence em 30 dias')return '<span class="badge b-amber">🟡 '+label+'</span>';
  if(sv==='Sem previsão')return '<span class="badge b-gray">⚠️ Sem previsão</span>';
  return '<span class="badge b-green">🟢 '+label+'</span>';
}
function renderKPIs(k){
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-label">💰 Total saldo a pagar</div><div class="kpi-val">${fmtUSD(k.totalSaldo)}</div><div class="kpi-delta gray">Em aberto</div></div>
    <div class="kpi"><div class="kpi-label">📋 Câmbios em aberto</div><div class="kpi-val">${k.qtdAberto}</div><div class="kpi-delta gray">Faturas pendentes</div></div>
    <div class="kpi ${k.venc30>0?'warn':''}"><div class="kpi-label">📅 Vence em 30 dias</div><div class="kpi-val ${k.venc30>0?'amber':''}">${fmtUSD(k.venc30)}</div><div class="kpi-delta ${k.venc30>0?'amber-t':'gray'}">${k.venc30>0?'Atenção necessária':'Nenhum'}</div></div>
    <div class="kpi ${k.vencidos>0?'alert':''}"><div class="kpi-label">🔴 Vencidos</div><div class="kpi-val ${k.vencidos>0?'red':''}">${fmtUSD(k.vencidos)}</div><div class="kpi-delta ${k.vencidos>0?'red-t':'green'}">${k.vencidos>0?'Regularizar urgente':'Tudo em dia'}</div></div>
  `;
}
function renderTimeline(proximos){
  const colors=['#E74C3C','#E67E22','#F39C12','#3498DB','#27AE60','#9B59B6','#555','#888'];
  document.getElementById('timeline').innerHTML=proximos.slice(0,7).map((c,i)=>`
    <div class="tl-item">
      <div class="tl-dot-wrap"><div class="tl-dot" style="background:${colors[i%colors.length]};"></div>${i<proximos.length-1?'<div class="tl-line"></div>':''}</div>
      <div class="tl-content">
        <div class="tl-name">${c.fornecedor} <span class="badge ${c.statusVenc==='Vencido'?'b-red':c.statusVenc==='Vence em 30 dias'?'b-amber':'b-green'}">${c.previsao||'—'}</span></div>
        <div class="tl-sub">${c.projeto} — ${fmtUSD(c.saldo)} ${c.previsaoLabel?'• '+c.previsaoLabel:''}</div>
      </div>
    </div>
  `).join('')||'<div style="color:rgba(255,255,255,.25);font-size:12px;">Nenhum vencimento programado</div>';
}
function renderFornBars(fornSaldo){
  const entries=Object.entries(fornSaldo).slice(0,6);
  const max=entries[0]?entries[0][1]:1;
  document.getElementById('forn-bars').innerHTML=entries.map(([n,v])=>`
    <div class="bar-row"><div class="bar-name">${n}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%;background:#C0392B;"></div></div><div class="bar-val">${fmtUSD(v)}</div></div>
  `).join('');
}
function renderPie(statusCounts){
  const entries=Object.entries(statusCounts).sort((a,b)=>b[1]-a[1]);
  if(pieChart)pieChart.destroy();
  pieChart=new Chart(document.getElementById('pieChart'),{
    type:'doughnut',
    data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:entries.map((_,i)=>PIE_COLORS[i%PIE_COLORS.length]),borderColor:'#242424',borderWidth:2}]},
    options:{responsive:false,cutout:'66%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.label+': '+ctx.parsed}}}}
  });
  document.getElementById('pie-legend').innerHTML=entries.map(([n,v],i)=>`
    <div class="legend-row"><div class="legend-dot" style="background:${PIE_COLORS[i%PIE_COLORS.length]};"></div><div class="legend-name">${n}</div><div class="legend-val">${v}</div></div>
  `).join('');
}
function renderFilters(cambios){
  const statuses=[...new Set(cambios.filter(c=>c.saldo>0).map(c=>c.statusVenc).filter(Boolean))];
  document.getElementById('filter-btns').innerHTML=[['todos','Todos'],...statuses.map(s=>[s,s])].map(([val,label])=>`
    <button class="filter-btn${currentFilter===val?' active':''}" onclick="setFilter('${val}')">${label}</button>
  `).join('');
}
function applyFilters(){
  let data=allData.cambios.filter(c=>c.saldo>0);
  if(currentFilter!=='todos')data=data.filter(c=>c.statusVenc===currentFilter);
  if(currentSearch){const q=currentSearch.toLowerCase();data=data.filter(c=>(c.projeto||'').toLowerCase().includes(q)||(c.fornecedor||'').toLowerCase().includes(q)||(c.fatura||'').toLowerCase().includes(q)||(c.embarque||'').toLowerCase().includes(q));}
  if(sortKey){data=[...data].sort((a,b)=>{const av=(a[sortKey]??'').toString();const bv=(b[sortKey]??'').toString();return sortAsc?av.localeCompare(bv,undefined,{numeric:true}):bv.localeCompare(av,undefined,{numeric:true});});}
  filteredData=data;
  const tbody=document.getElementById('tableBody');
  const noRes=document.getElementById('noResults');
  const count=document.getElementById('searchCount');
  if(!filteredData.length){tbody.innerHTML='';noRes.style.display='block';count.textContent='0 resultados';return;}
  noRes.style.display='none';
  const q=currentSearch;
  count.textContent=q||currentFilter!=='todos'?filteredData.length+(filteredData.length===1?' resultado':' resultados'):'';
  tbody.innerHTML=filteredData.map(c=>`<tr>
    <td style="font-weight:600;">${hl(c.projeto,q)}</td>
    <td>${hl(c.embarque,q)||'—'}</td>
    <td>${hl(c.fornecedor,q)}</td>
    <td style="color:rgba(255,255,255,.5);">${c.fatura||'—'}</td>
    <td style="text-align:right;">${fmtUSD(c.valor)}</td>
    <td style="text-align:center;color:rgba(255,255,255,.4);">${fmtPct(c.pct1)}</td>
    <td style="text-align:right;">${c.pago1?fmtUSD(c.pago1):'—'}</td>
    <td style="text-align:center;color:rgba(255,255,255,.4);">${fmtPct(c.pct2)}</td>
    <td style="text-align:right;">${c.pago2?fmtUSD(c.pago2):'—'}</td>
    <td style="text-align:center;color:rgba(255,255,255,.4);">${fmtPct(c.pct3)}</td>
    <td style="text-align:right;">${c.pago3?fmtUSD(c.pago3):'—'}</td>
    <td style="text-align:right;font-weight:600;color:${c.statusVenc==='Vencido'?'#E74C3C':c.statusVenc==='Vence em 30 dias'?'#E67E22':'#fff'}">${fmtUSD(c.saldo)}</td>
    <td><span class="badge b-blue">${c.statusCambio||'—'}</span></td>
    <td>${badgeVenc(c.statusVenc,c.previsaoLabel||c.previsao||'')}</td>
  </tr>`).join('');
}
function filterTable(val){currentSearch=val;document.getElementById('clearBtn').style.display=val?'block':'none';applyFilters();}
function clearSearch(){const inp=document.getElementById('searchInput');inp.value='';inp.focus();filterTable('');}
function setFilter(val){currentFilter=val;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(val==='todos'?'Todos':val)));applyFilters();}
function sortTable(key){if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=true;}applyFilters();}
async function loadData(){
  const now=new Date();
  document.getElementById('hdr-date').textContent=now.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
  try{
    const res=await fetch('dados_cambio.json?t='+Date.now());
    if(!res.ok)throw new Error();
    allData=await res.json();
    document.getElementById('hdr-update').textContent='Dados de '+allData.geradoEm;
    document.getElementById('footer-update').textContent='Gerado em '+allData.geradoEm;
    renderKPIs(allData.kpis);
    renderTimeline(allData.proximos);
    renderFornBars(allData.fornSaldo);
    renderPie(allData.statusCounts);
    renderFilters(allData.cambios);
    applyFilters();
  }catch(e){
    document.getElementById('hdr-update').textContent='Erro ao carregar dados';
    document.getElementById('noResults').style.display='block';
    document.getElementById('noResults').innerHTML='<div style="color:rgba(255,255,255,.3);font-size:13px;line-height:1.8;">Arquivo <strong>dados_cambio.json</strong> não encontrado.<br>Execute: <code style="background:#1E1E1E;padding:4px 10px;border-radius:6px;">python gerar_dados_cambio.py</code></div>';
  }
}
loadData();
setInterval(loadData,60000);
<\/script>
</body>
</html>
